# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm (DE = 1)
#   b) Theo nhân viên, m = 75: DE = 1 + 74 * 0,02 = 2,48 -> cần 3.103 yêu cầu/nhóm (~42 nhân viên/nhóm, tổng 84 > 40 hiện có: KHÔNG ĐỦ)
#   c) 20 nhân viên mỗi nhóm: trần cỡ mẫu hiệu dụng c / ICC = 20 / 0,02 = 1.000 (< 1.251: KHÔNG ĐẠT cho mức chênh 5 điểm)
#   d) 6 depot mỗi nhóm: trần cỡ mẫu hiệu dụng c / ICC = 6 / 0,02 = 300 (< 1.251: KHÔNG ĐẠT)
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: 20m / (1 + (m - 1)*0,02) >= 859 -> cần m >= 299 yêu cầu mỗi nhân viên (DE = 6,96)
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên đối chứng làm việc song song cùng thời gian và cùng 12 depot.
#   2. Chia ngẫu nhiên hay do người chọn: Bốc thăm ngẫu nhiên bằng code có seed cố định, phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro nhân viên cùng depot chia sẻ gợi ý; giảm bằng phân quyền theo staff_id và log lượt mở trợ lý.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có, chốt trước chỉ số chính, MDE 0,06, 3 luật dừng và ngày quyết định 2027-01-05.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 nhân viên (cụm) mỗi nhóm.
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Với 40 nhân viên (20 cụm/nhóm), trần hiệu dụng tối đa là 1.000 < 1.251 nên không đủ mẫu cho MDE 5 điểm. Nhóm chọn chia theo nhân viên và chấp nhận nới MDE lên 6 điểm (859/nhóm, m >= 299); nếu tác động thật chỉ là 5 điểm thì power giảm còn khoảng 0,64.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Hiện tại toàn mẫu là 4,25% (51/1.200) và trong phạm vi noi_dia + hang_nang là 3,97%. Do đó không đặt ngưỡng dừng tuyệt đối 3% mà chọn ngưỡng so sánh >= +2 điểm % so với đối chứng kèm trần tuyệt đối 6%.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia (2.696 đ, 0,22x, simulated) và hang_nang (8.221 đ, 0,69x, simulated) tại 12 depot; loại quoc_te (22.515 đ, 1,88x, simulated) và doi_tac (10.215 đ, 0,85x, simulated)"
  assignment:
    unit: "staff"
    control_share: 0.5
