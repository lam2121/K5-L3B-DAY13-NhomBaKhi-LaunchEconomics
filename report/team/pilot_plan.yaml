    - "phạm vi noi_dia 2.696 đ (0,22x, simulated) và hang_nang 8.221 đ (0,69x, simulated); cộng cố định 40 triệu/tháng = 4.599 đ ở 45k yc hoặc 5.784 đ ở nửa khối lượng (simulated)"
    - "kịch bản B4 xem lại 100%: 11.743 đ với 9 phút làm lại hoặc 12.415 đ với 15,3 phút làm lại thực tế (simulated)"
